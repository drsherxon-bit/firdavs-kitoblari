<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Normativlar — Firdavs kitoblari</title>
<meta name="description" content="Madina kitoblarining normativ matnlari: ustoz o‘qigan audiolar, kitob bo‘yicha.">
<meta name="theme-color" content="#FBF9F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#27251E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Firdavs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script>try{var t=localStorage.getItem("firdavs:theme");if(t){document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}}catch(e){}</script>
<style>
  :root {
    --paper: #FBF9F2; --card: #FFFDF7; --ink: #0A0A0A; --muted: #726D65; --line: #D7DDE6;
    --accent: #006A47; --asl: #6E5326; --accent-soft: #D9F4EB; --asl-soft: #F1E9DA;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #27251E; --card: #2A2820; --ink: #F5F3EF; --muted: #A5A19B; --line: #4B5A70;
      --accent: #07AF77; --asl: #C9A96A; --accent-soft: #1A362C; --asl-soft: #3B3426;
    }
  }
  :root[data-theme="dark"] {
    --paper: #27251E; --card: #2A2820; --ink: #F5F3EF; --muted: #A5A19B; --line: #4B5A70;
    --accent: #07AF77; --asl: #C9A96A; --accent-soft: #1A362C; --asl-soft: #3B3426;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Literata", Georgia, serif; line-height: 1.5;
    padding: 0 18px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .ar { font-family: "Amiri", serif; direction: rtl; unicode-bidi: isolate; }

  .top { display: flex; align-items: center; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 0 6px; }
  .top .t-txt { flex: 1; min-width: 0; }
  .top h1 { margin: 0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  .top .t-ar { font-family: "Scheherazade New", "Amiri", serif; direction: rtl; text-align: left; font-size: 1.35rem; font-weight: 700; color: var(--asl); line-height: 1.4; }
  .ib {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none;
    text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .ib svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ib:active { color: var(--accent); border-color: var(--accent); }
  .t-sub { color: var(--muted); font-size: 0.84rem; margin: 0 0 12px; }

  /* kitob tanlash */
  .pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .pick button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 7px 14px; font: inherit; font-size: 0.88rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .pick button .j { width: 22px; height: 22px; border-radius: 50%; background: var(--asl-soft); color: var(--asl); font-family: "Scheherazade New", "Amiri", serif; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem; line-height: 1; }
  .pick button.on { border-color: var(--asl); color: var(--asl); font-weight: 700; background: var(--asl-soft); }
  .pick button:disabled { opacity: 0.45; cursor: default; }
  .pick button:disabled small { font-size: 0.7rem; color: var(--muted); font-weight: 400; }

  /* darslar va audiolar */
  .dars { margin: 0 0 18px; }
  .dars h2 {
    display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px;
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: var(--asl);
  }
  .dars h2::after { content: ""; flex: 1; height: 1px; background: var(--asl); opacity: 0.35; }
  .dars h2 .h-ar { font-family: "Amiri", serif; direction: rtl; font-size: 1.05rem; letter-spacing: 0; text-transform: none; }
  .dars h2 a { margin-left: auto; font-size: 0.66rem; letter-spacing: 0.08em; color: var(--muted); text-decoration: none; text-transform: none; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .it {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px 9px 10px;
  }
  .it.on { border-color: var(--asl); }
  .it .tt { font-family: "Amiri", serif; direction: rtl; unicode-bidi: isolate; text-align: right; font-size: 1.15rem; line-height: 1.6; min-width: 0; }
  .it .tt .k { display: inline-block; font-family: "Literata", Georgia, serif; direction: ltr; font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-left: 8px; vertical-align: middle; }
  .it .sn { grid-column: 1 / -1; font-family: "Amiri", serif; direction: rtl; unicode-bidi: isolate; text-align: right; font-size: 0.98rem; color: var(--muted); line-height: 1.5; margin-top: -2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it .meta { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .it .meta b { color: var(--asl); font-weight: 700; }
  .it .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--asl); opacity: 0; transition: opacity .2s; }
  .it.on .bar, .it.paused .bar { opacity: 1; }

  /* pleyer tugmalari (kitobdagi bilan bir xil) */
  .aud { display: flex; align-items: center; gap: 6px; direction: ltr; }
  .au { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 7px;
    border: 1px solid var(--asl); border-radius: 999px; background: transparent; color: var(--asl);
    font: 600 0.8rem/1.25 "Literata", Georgia, serif; font-variant-numeric: tabular-nums; cursor: pointer; --p: 0%; -webkit-tap-highlight-color: transparent; }
  .au svg { width: 12px; height: 12px; flex: none; fill: currentColor; stroke: none; }
  .au .q { display: none; }
  .au.on { background: var(--asl); color: var(--card); }
  .au.on .p { display: none; }
  .au.on .q { display: block; }
  .au:focus-visible { outline: 2px solid var(--asl); outline-offset: 2px; }
  .sk { display: flex; gap: 6px; }
  .sk[hidden] { display: none; }
  .sb { width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--card); color: var(--asl);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  .sb svg { width: 19px; height: 19px; }
  .sb .arc { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .sb .ah { fill: currentColor; stroke: none; }
  .sb text { fill: currentColor; stroke: none; font: 700 9px "Literata", Georgia, serif; }
  .sb:active { background: var(--asl); color: var(--card); }
  .sb:focus-visible { outline: 2px solid var(--asl); outline-offset: 2px; }

  .empty { color: var(--muted); font-size: 0.9rem; padding: 20px 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--ink); color: var(--paper); border-radius: 10px; padding: 10px 16px; font-size: 0.88rem;
    display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,0.25); z-index: 20; max-width: calc(100vw - 32px);
  }
  .toast button { border: 0; background: var(--accent); color: #fff; border-radius: 7px; padding: 6px 12px; font: inherit; font-weight: 700; cursor: pointer; }
  .toast[hidden] { display: none; }
  .foot { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.8rem; }
  @media (max-width: 400px) { .it .tt { font-size: 1.05rem; } .it .meta { gap: 10px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="ib" href="./" aria-label="Kutubxona"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="t-txt">
      <h1>Normativlar</h1>
      <div class="t-ar">مَعَايِيرُ القِرَاءَةِ</div>
    </div>
    <button class="ib" id="theme" type="button" aria-label="Mavzu"></button>
  </header>
  <p class="t-sub">Har mavzuning normativ matni — ustoz o‘qishi (arabcha + tarjima). Kitobni tanlang.</p>

  <div class="pick" id="pick"></div>
  <div id="list"><p class="empty">Yuklanmoqda…</p></div>

  <footer class="foot"><span id="cnt"></span></footer>
</div>
<div class="toast" id="toast" hidden><span>Kitoblarning yangi nusxasi bor.</span><button type="button" id="reload">Yangilash</button></div>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* mavzu (index bilan bir xil) */
  var tb = document.getElementById("theme");
  var order = ["", "dark", "light"], theme = get("firdavs:theme") || "";
  var icons = {
    "": '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>',
    dark: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
    light: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  };
  function applyTheme() {
    if (theme) { root.setAttribute("data-theme", theme); root.style.colorScheme = theme; }
    else { root.removeAttribute("data-theme"); root.style.colorScheme = ""; }
    tb.innerHTML = icons[theme];
  }
  applyTheme();
  tb.addEventListener("click", function () { theme = order[(order.indexOf(theme) + 1) % 3]; set("firdavs:theme", theme); applyTheme(); });

  /* ---- pleyer ---- */
  var AR = ["٠", "١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩"];
  var ARC = '<path class="arc" d="M12 6A7 7 0 1 1 5.94 9.5"/><path class="ah" d="M12.4 2.4V9.6L7.6 6z"/>';
  function fmt(s) { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60); }
  var btn = null, a = null;
  function row() { return btn ? btn.closest(".it") : null; }
  function dur() { return btn ? (parseFloat(btn.getAttribute("data-dur")) || (a && isFinite(a.duration) ? a.duration : 0)) : 0; }
  function skip(on) {
    var k = btn && btn.parentNode.querySelector(".sk"); if (k) k.hidden = !on;
  }
  function paint() {
    if (!btn || !a) return;
    var d = dur(), t = a.currentTime || 0;
    btn.querySelector(".ad").textContent = fmt(t > 0 && !a.ended ? t : d);
    var r = row(), bar = r && r.querySelector(".bar");
    if (bar) bar.style.width = (d ? Math.min(100, t / d * 100) : 0) + "%";
  }
  function stop() {
    if (!btn) return;
    skip(false);
    var r = row();
    btn.classList.remove("on");
    if (r) { r.classList.remove("on"); r.classList.remove("paused"); var bar = r.querySelector(".bar"); if (bar) bar.style.width = "0%"; }
    btn.querySelector(".ad").textContent = fmt(parseFloat(btn.getAttribute("data-dur")) || 0);
    btn = null;
  }
  function player() {
    if (a) return a;
    a = new Audio(); a.preload = "none";
    a.addEventListener("timeupdate", paint);
    a.addEventListener("ended", stop);
    a.addEventListener("play", function () { var r = row(); if (btn) { btn.classList.add("on"); } if (r) { r.classList.add("on"); r.classList.remove("paused"); } });
    a.addEventListener("pause", function () { var r = row(); if (btn && !a.ended) { btn.classList.remove("on"); if (r) { r.classList.remove("on"); r.classList.add("paused"); } } });
    a.addEventListener("error", function () { if (btn) { btn.querySelector(".ad").textContent = "xato"; btn.classList.remove("on"); } });
    return a;
  }
  document.addEventListener("click", function (e) {
    var sb = e.target.closest ? e.target.closest(".sb") : null;
    if (sb) {
      e.preventDefault();
      if (!a || !btn) return;
      var d = dur(), t = (a.currentTime || 0) + (parseFloat(sb.getAttribute("data-skip")) || 0);
      a.currentTime = Math.max(0, d ? Math.min(d, t) : Math.max(0, t));
      paint(); return;
    }
    var b = e.target.closest ? e.target.closest(".au") : null;
    if (!b) return;
    e.preventDefault();
    var p = player();
    if (btn === b) { if (p.paused) p.play().catch(function () {}); else p.pause(); return; }
    if (btn) { p.pause(); stop(); }
    btn = b; skip(true);
    p.src = b.getAttribute("data-src");
    p.play().catch(function () {});
  });

  /* ---- kitoblar va ro'yxat ---- */
  var pick = document.getElementById("pick"), list = document.getElementById("list"), cnt = document.getElementById("cnt");
  var books = [], current = null;
  function generic(it) { return it.title === "Dars matni" || /^[(«]?\s*[؀-ۿ]{1,2}\s*[)»]?$/.test(it.title) || /^\(\s*[٠-٩]+\s*\)$/.test(it.title); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function render(idx, b) {
    if (btn) { if (a) a.pause(); stop(); }
    var byDars = {}, order = [];
    idx.items.forEach(function (it) { if (!byDars[it.dars]) { byDars[it.dars] = []; order.push(it.dars); } byDars[it.dars].push(it); });
    var html = "";
    order.forEach(function (d) {
      var items = byDars[d], t = items[0].darsTitle || "";
      html += '<section class="dars"><h2>' + d + '-dars <span class="h-ar">' + esc(t) + '</span>' +
        '<a href="kitob/' + esc(b.slug) + '.html#dars-' + d + '">kitobda ochish ›</a></h2><div class="list">';
      items.forEach(function (it) {
        html += '<div class="it" data-n="' + it.n + '">' +
          '<span class="aud"><span class="sk" hidden>' +
            '<button type="button" class="sb" data-skip="-5" aria-label="5 soniya orqaga"><svg viewBox="0 0 24 24" aria-hidden="true">' + ARC + '<text x="12" y="16.4" text-anchor="middle">5</text></svg></button>' +
            '<button type="button" class="sb" data-skip="5" aria-label="5 soniya oldinga"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="matrix(-1 0 0 1 24 0)">' + ARC + '</g><text x="12" y="16.4" text-anchor="middle">5</text></svg></button>' +
          '</span>' +
          '<button class="au" type="button" data-src="' + esc(it.file) + '" data-dur="' + it.dur + '" aria-label="Tinglash (' + fmt(it.dur) + ')">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="p" d="M8 5v14l11-7z"/><path class="q" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><span class="ad">' + fmt(it.dur) + '</span></button></span>' +
          '<div class="tt">' + esc(it.title) + '<span class="k">' + (it.kind === "mashq" ? "mashq" : "matn") + '</span></div>' +
          (generic(it) && it.snippet ? '<div class="sn">' + esc(it.snippet) + ' …</div>' : "") +
          '<div class="meta">' + (it.nrm ? '<span>normativ <b>' + esc(it.nrm) + '</b></span>' : "") + '<span>audio ' + fmt(it.dur) + '</span><span>№ ' + it.n + '</span></div>' +
          '<i class="bar"></i></div>';
      });
      html += '</div></section>';
    });
    list.innerHTML = html || '<p class="empty">Bu kitob uchun audio hali yo‘q.</p>';
    cnt.textContent = idx.items.length + " ta audio · " + order.length + " dars";
  }
  function choose(slug) {
    var b = books.filter(function (x) { return x.slug === slug && x.audio; })[0];
    if (!b) return;
    current = slug; set("firdavs:nrm-book", slug);
    try { history.replaceState(null, "", "?kitob=" + slug); } catch (e) {}
    Array.prototype.forEach.call(pick.children, function (el) { el.classList.toggle("on", el.getAttribute("data-slug") === slug); });
    list.innerHTML = '<p class="empty">Yuklanmoqda…</p>';
    fetch("audio/" + b.audio + "/index.json").then(function (r) { return r.json(); })
      .then(function (idx) { if (current === slug) render(idx, b); })
      .catch(function () { list.innerHTML = '<p class="empty">Ro‘yxat yuklanmadi.</p>'; });
  }
  fetch("app/books.json").then(function (r) { return r.json(); }).then(function (all) {
    books = all.filter(function (b) { return b.kind === "asl"; });
    books.forEach(function (b) {
      var el = document.createElement("button"); el.type = "button"; el.setAttribute("data-slug", b.slug);
      el.innerHTML = '<span class="j">' + AR[b.juz] + '</span>' + esc(b.uz) + (b.audio ? "" : " <small>tez kunda</small>");
      if (!b.audio) el.disabled = true;
      el.addEventListener("click", function () { choose(b.slug); });
      pick.appendChild(el);
    });
    var q = (/[?&]kitob=([\w-]+)/.exec(location.search) || [])[1];
    var first = (books.filter(function (b) { return b.audio; })[0] || {}).slug;
    choose(q || get("firdavs:nrm-book") || first);
  });

  /* oflayn xizmatchi: yangi nusxa kutayotgan bo'lsa (masalan, QR orqali kelganda) — «Yangilash» */
  if ("serviceWorker" in navigator) {
    var hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      var t = document.getElementById("toast");
      function offer(w) { t.hidden = false; document.getElementById("reload").onclick = function () { t.hidden = true; w.postMessage("SKIP_WAITING"); }; }
      function track(w) { if (w) w.addEventListener("statechange", function () { if (w.state === "installed" && navigator.serviceWorker.controller) offer(w); }); }
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      else if (reg.installing) track(reg.installing);
      reg.addEventListener("updatefound", function () { track(reg.installing); });
      navigator.serviceWorker.addEventListener("controllerchange", function () { if (hadSW) location.reload(); });
      reg.update().catch(function () {});
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
